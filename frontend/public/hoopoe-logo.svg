<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Plate: dark rounded square, matches the splash plate colour (midpoint
       of the #161a21 → #0f1218 gradient used in index.html). Solid fill
       because gradient fills are often lost on OS icon rendering paths. -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="#131720"/>

  <!-- Hairline teal inner border (10% opacity) for crisp separation. -->
  <rect x="2" y="2" width="1020" height="1020" rx="228" ry="228"
        fill="none" stroke="#7dd3c0" stroke-opacity="0.10" stroke-width="4"/>

  <!-- Top-left corner sheen: a subtle highlight for glassy depth. -->
  <path d="M 0 0 L 1024 0 L 0 1024 Z" fill="#ffffff" opacity="0.025"/>

