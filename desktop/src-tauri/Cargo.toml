[package]
name = "hoopoe-desktop"
version = "1.0.0-rc.8"
description = "Hoopoe desktop shell"
authors = ["Gekkotron"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hoopoe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
